  <animate attributeName="x2" values="24;416" dur="1.2s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
</line>
<text x="24" y="104.0" fill="#C9D1D9" font-size="13.5" opacity="0">Real-time multi-agent SOC: a 9-agent LangGraph<animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.3s" fill="freeze"/></text><text x="24" y="123.5" fill="#C9D1D9" font-size="13.5" opacity="0">pipeline detects attacks, reasons like an analyst,<animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.44999999999999996s" fill="freeze"/></text><text x="24" y="143.0" fill="#C9D1D9" font-size="13.5" opacity="0">maps to MITRE ATT&amp;CK and plans a response, live<animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.6s" fill="freeze"/></text><text x="24" y="162.5" fill="#C9D1D9" font-size="13.5" opacity="0">over a WebSocket dashboard.<animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.75s" fill="freeze"/></text>
<rect x="24" y="184" width="62.8" height="22" rx="11" fill="#00D9FF" fill-opacity="0.12" stroke="#00D9FF" stroke-opacity="0.45"/><text x="55.4" y="199" fill="#00D9FF" font-size="11.5" font-weight="600" text-anchor="middle">Python</text><rect x="94.8" y="184" width="69.6" height="22" rx="11" fill="#00D9FF" fill-opacity="0.12" stroke="#00D9FF" stroke-opacity="0.45"/><text x="129.6" y="199" fill="#00D9FF" font-size="11.5" font-weight="600" text-anchor="middle">FastAPI</text><rect x="172.39999999999998" y="184" width="83.19999999999999" height="22" rx="11" fill="#00D9FF" fill-opacity="0.12" stroke="#00D9FF" stroke-opacity="0.45"/><text x="213.99999999999997" y="199" fill="#00D9FF" font-size="11.5" font-weight="600" text-anchor="middle">LangGraph</text><rect x="263.59999999999997" y="184" width="49.2" height="22" rx="11" fill="#00D9FF" fill-opacity="0.12" stroke="#00D9FF" stroke-opacity="0.45"/><text x="288.2" y="199" fill="#00D9FF" font-size="11.5" font-weight="600" text-anchor="middle">LLMs</text>
<text x="416" y="226" fill="#8B949E" font-size="11.5" text-anchor="end">View repository
