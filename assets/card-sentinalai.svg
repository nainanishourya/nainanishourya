    <animate attributeName="x" values="-200;-200;560" keyTimes="0;0.55;1" dur="6s" begin="0s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x="1" y="1" width="438" height="238" rx="14" fill="none" stroke="url(#bd)" stroke-width="1.6"/>
<rect x="24" y="20" width="44" height="44" rx="11" fill="url(#ic)"/>
<text x="46" y="48.5" fill="#fff" font-size="16" font-weight="800" text-anchor="middle">SA</text>
<text x="80" y="40" fill="#FFFFFF" font-size="19" font-weight="700">SentinalAI</text>
<text x="80" y="59" fill="#00D9FF" font-size="11" font-weight="700" letter-spacing="1.4">AI SECURITY OPERATIONS CENTER</text>
<rect x="310.3" y="24" width="109.7" height="22" rx="11" fill="#00D9FF" fill-opacity="0.12" stroke="#00D9FF" stroke-opacity="0.5"/>
