<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240" role="img" aria-label="AI4Students">
<defs>
  <linearGradient id="bd" x1="0" y1="0" x2="440" y2="240" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#00D9FF"/><stop offset="0.5" stop-color="#A855F7" stop-opacity="0.25"/><stop offset="1" stop-color="#A855F7"/>
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 220.0 120.0;360 220.0 120.0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00D9FF"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
  <radialGradient id="glow" cx="0.15" cy="0.1" r="0.7"><stop offset="0" stop-color="#A855F7" stop-opacity="0.22"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="cp"><rect x="1" y="1" width="438" height="238" rx="14"/></clipPath>
</defs>
<g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
<rect x="1" y="1" width="438" height="238" rx="14" fill="#0D1117"/>
<g clip-path="url(#cp)">
  <rect width="440" height="240" fill="url(#glow)"><animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/></rect>
  <rect x="-160" y="-40" width="120" height="320" fill="url(#shine)" transform="skewX(-20)">
    <animate attributeName="x" values="-200;-200;560" keyTimes="0;0.55;1" dur="6s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x="1" y="1" width="438" height="238" rx="14" fill="none" stroke="url(#bd)" stroke-width="1.6"/>
<rect x="24" y="20" width="44" height="44" rx="11" fill="url(#ic)"/>
<text x="46" y="48.5" fill="#fff" font-size="16" font-weight="800" text-anchor="middle">AI</text>
<text x="80" y="40" fill="#FFFFFF" font-size="19" font-weight="700">AI4Students</text>
<text x="80" y="59" fill="#00D9FF" font-size="11" font-weight="700" letter-spacing="1.4">NGO WEBSITE · SOCIAL INITIATIVE</text>
<rect x="358.4" y="24" width="61.6" height="22" rx="11" fill="#3FB950" fill-opacity="0.12" stroke="#3FB950" stroke-opacity="0.5"/>
<circle cx="372.4" cy="35" r="4" fill="#3FB950"></circle><circle cx="372.4" cy="35" r="4" fill="none" stroke="#3FB950"><animate attributeName="r" values="4;9" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/></circle><text x="382.4" y="39" fill="#3FB950" font-size="11" font-weight="700" letter-spacing="1">LIVE</text>
<line x1="24" y1="80" x2="24" y2="80" stroke="url(#ic)" stroke-width="2" stroke-linecap="round">
  <animate attributeName="x2" values="24;416" dur="1.2s" begin="1.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
</line>
<text x="24" y="104.0" fill="#C9D1D9" font-size="13.5" opacity="0">Responsive multi-page website for an NGO<animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.9000000000000001s" fill="freeze"/></text><text x="24" y="123.5" fill="#C9D1D9" font-size="13.5" opacity="0">spreading AI awareness among school students<animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.0500000000000003s" fill="freeze"/></text><text x="24" y="143.0" fill="#C9D1D9" font-size="13.5" opacity="0">(classes 8–12), focused on government schools<animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.2s" fill="freeze"/></text><text x="24" y="162.5" fill="#C9D1D9" font-size="13.5" opacity="0">and underserved communities.<animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.35s" fill="freeze"/></text>
<rect x="24" y="184" width="56.0" height="22" rx="11" fill="#00D9FF" fill-opacity="0.12" stroke="#00D9FF" stroke-opacity="0.45"/><text x="52.0" y="199" fill="#00D9FF" font-size="11.5" font-weight="600" text-anchor="middle">HTML5</text><rect x="88.0" y="184" width="49.2" height="22" rx="11" fill="#00D9FF" fill-opacity="0.12" stroke="#00D9FF" stroke-opacity="0.45"/><text x="112.6" y="199" fill="#00D9FF" font-size="11.5" font-weight="600" text-anchor="middle">CSS3</text><rect x="145.2" y="184" width="90.0" height="22" rx="11" fill="#00D9FF" fill-opacity="0.12" stroke="#00D9FF" stroke-opacity="0.45"/><text x="190.2" y="199" fill="#00D9FF" font-size="11.5" font-weight="600" text-anchor="middle">JavaScript</text>
<text x="416" y="226" fill="#8B949E" font-size="11.5" text-anchor="end">View repository
  <tspan fill="#00D9FF" font-weight="700">→<animate attributeName="dx" values="0;4;0" dur="1.6s" repeatCount="indefinite"/></tspan></text>
</g>
</svg>